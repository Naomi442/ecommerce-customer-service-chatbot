<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电商智能客服</title><link rel="stylesheet" href="/styles.css"></head>
<body><main><aside><p class="eyebrow">RAG TEMPLATE COPILOT</p><h1>电商智能客服</h1><p class="muted">从平台、行业与场景中找对话术，再填充真实信息。</p><label>平台<select id="platform"><option value="all">自动识别</option><option value="amazon">Amazon</option><option value="shopee">Shopee</option><option value="shopify">Shopify</option><option value="temu">Temu</option><option value="tiktok-shop">TikTok Shop</option><option value="aliexpress">AliExpress</option><option value="ebay">eBay</option><option value="lazada">Lazada</option><option value="taobao">淘宝</option><option value="jd">京东</option></select></label><label>行业<select id="industry"><option value="all">全部行业</option><option value="beauty">美妆护肤</option><option value="fashion">服装</option><option value="electronics">电子产品</option><option value="baby-products">母婴用品</option><option value="fresh-food">生鲜食品</option></select></label><label>回复语言<select id="language"><option value="auto">按模板/自动</option><option value="zh">中文</option><option value="en">English</option></select></label><div id="health" class="status">正在载入知识库…</div><p class="tiny">不要将 API Key 输入网页。它只应配置在服务器的 <code>.env</code> 文件中。</p></aside>
<section class="chat"><header><div><h2>客服回复助手</h2><p>例如：“Shopee 客人说包裹晚了三天，怎么回复？”</p></div><button id="clear" class="ghost">清空对话</button></header><div id="messages" class="messages"><article class="bot"><b>助手</b><p>你好，请输入客户的问题。我会先匹配合适的话术；涉及退款、赔偿或平台争议时会提示人工确认。</p></article></div><section id="variablePanel" class="variables hidden"><h3>补充模板所需信息</h3><p id="variableHint"></p><div id="variableFields"></div><button id="regenerate">用填写的信息生成回复</button></section><form id="chatForm"><textarea id="message" placeholder="输入客户问题…" rows="3" required></textarea><button type="submit">发送</button></form></section>
<aside class="evidence"><h2>命中依据</h2><div id="evidence"><p class="muted">发送问题后，这里会显示选用话术及其来源。</p></div></aside></main><script src="/app.js"></script></body></html>
